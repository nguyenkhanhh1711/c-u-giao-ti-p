<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
$('#falls').innerHTML=[10,30,50,70,88].map((l,i)=>`<svg class="fall" viewBox="0 0 40 40" style="left:${l}%;animation-duration:${16+i*4}s;animation-delay:-${i*5}s"><path d="M5 35C5 15 20 3 37 4 36 22 24 36 5 35z" fill="${['#8fcf6a','#e8c44e','#7bbf8a','#c7dd6a','#f0d36a'][i]}" opacity=".7"/></svg>`).join('');
let ac;function beep(a){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();a.forEach(([f,t,d,y])=>{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.type=y||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.22,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.05)})}catch(e){}}
const ok=()=>beep([[660,0,.15],[880,.12,.3]]),no=()=>beep([[220,0,.2,'sawtooth'],[150,.18,.3,'sawtooth']]);
/* voice */
let stopFlag=0;
function stopAll(){stopFlag++;try{speechSynthesis.cancel()}catch(e){}$$('.play.on').forEach(b=>b.classList.remove('on'));$$('.line.hl').forEach(l=>l.classList.remove('hl'))}
function say(t,r){stopAll();try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r||.85;const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function playD(i,btn){if(btn.classList.contains('on')){stopAll();return}stopAll();btn.classList.add('on');const my=stopFlag,ls=$$(`#d${i} .line`),names=[];let k=0;
const next=()=>{if(my!=stopFlag)return;if(k>=ls.length){stopAll();return}const el=ls[k++];ls.forEach(l=>l.classList.remove('hl'));el.classList.add('hl');el.scrollIntoView({block:'center',behavior:'smooth'});const sp=el.querySelector('b').textContent;if(!names.includes(sp))names.push(sp);const u=new SpeechSynthesisUtterance(el.querySelector('span').textContent);u.lang='en-US';u.rate=.92;u.pitch=names.indexOf(sp)%2?.8:1.15;const v=speechSynthesis.getVoices().filter(v=>/en[-_]US/i.test(v.lang));if(v.length)u.voice=v[names.indexOf(sp)%v.length];u.onend=u.onerror=()=>setTimeout(next,250);speechSynthesis.speak(u)};next()}
/* data */
const PH=`Get down to business|Bắt đầu vào việc chính / Bắt tay vào làm việc.
On track|Đúng tiến độ / Đi đúng hướng.
Call in sick|Gọi điện báo cáo xin nghỉ ốm.
Cover for someone|Làm thay việc / Gánh vác giúp ai đó khi họ vắng mặt.
Behind schedule|Trễ tiến độ / Bị chậm kế hoạch.
Keep me posted|Nhớ cập nhật tình hình cho tôi nhé.
A table for two|Cho xin một bàn hai người (khi vào nhà hàng).
Grab a bite|Ăn vội / Ăn nhẹ cái gì đó.
On the house|Miễn phí (do nhà hàng bao / tặng).
Doggy bag|Túi / hộp để gói thức ăn thừa mang về.
Check, please|Cho xem hóa đơn / Tính tiền nhé.
Split the bill|Chia hóa đơn (mỗi người trả một phần).
Just browsing|Tôi chỉ xem thôi (chưa mua).
On sale|Đang được giảm giá.
A steal|Một món hời (giá rẻ như cho).
Try it on|Mặc thử / Thử đồ.
Out of stock|Đã hết hàng.
Rip-off|Giá cắt cổ / Trắng trợn lừa đảo (bán quá đắt).
Lost my way|Bị lạc đường.
Show me the way|Chỉ đường cho tôi.
Round trip|Chuyến đi khứ hồi (2 chiều).
Book in advance|Đặt chỗ / Mua vé từ trước.
Travel light|Du lịch gọn nhẹ (mang ít hành lý).
Off the beaten path|Những nơi xa xôi, hoang sơ, ít người tới.
Catch a movie|Đi xem phim.
Chill out|Thư giãn / Nghỉ ngơi.
Sleep in|Ngủ nướng (ngủ dậy muộn hơn bình thường).
Early bird|Người có thói quen dậy sớm.
Have a get-together|Tổ chức một buổi tụ tập bạn bè nhỏ.
Paint the town red|Đi chơi xả láng / Quẩy hết mình.`.split('\n').map(l=>l.split('|'));
const DL=[['Đoạn 1','At the Office','Tại nơi làm việc',[['Manager','Alright everyone, let’s stop chatting and [get down to business]. Is the new project [on track]?'],['Sarah','Mostly yes. But John had to [call in sick] today because of a fever.'],['Manager','I see. Who can [cover for him] while he’s away? We can’t afford to fall [behind schedule].'],['Sarah','I will handle his tasks. I will [keep you posted] if we need more time.']]],
['Đoạn 2','Eating Out','Đi ăn nhà hàng',[['Customer','Hi, we’d like [a table for two], please. We’re in a hurry and just want to [grab a bite].'],['Waiter','Right this way. And since it’s our restaurant’s anniversary, dessert is [on the house]!'],['Customer','That’s lovely! (After eating)… Could we get a [doggy bag] for the leftovers? And the [check, please].'],['Friend','Let me pay for this. Or we can [split the bill].']]],
['Đoạn 3','Shopping','Mua sắm',[['Staff','Hello, can I help you find anything?'],['Customer','No thanks, I’m [just browsing]. Oh wait, is this jacket [on sale]?'],['Staff','Yes, it’s 50% off today. At this price, it’s basically [a steal]!'],['Customer','Great, can I [try it on]? Also, do you have it in blue?'],['Staff','Sorry, the blue one is [out of stock]. But honestly, the black one looks better. Don’t buy at the other store across the street, their clothes are a total [rip-off].']]],
['Đoạn 4','Travel & Directions','Du lịch & Hỏi đường',[['Tourist','Excuse me, I think I [lost my way]. Could you [show me the way] to the central train station?'],['Local','Sure, go straight down this road. Are you buying a one-way or [round trip] ticket?'],['Tourist','Round trip. I had to [book in advance] because it’s peak season.'],['Local','Good idea. I see you only have one small backpack.'],['Tourist','Yes, I always [travel light]. I love exploring places that are [off the beaten path].']]],
['Đoạn 5','Weekend Plans','Kế hoạch cuối tuần',[['Anna','Hey, do you want to [catch a movie] tonight?'],['Tom','Nah, I’ve had a long week. I just want to stay home and [chill out]. Plus, I plan to [sleep in] tomorrow morning.'],['Anna','Really? You are usually an [early bird]!'],['Tom','Not this weekend. But maybe next Saturday we can [have a get-together] and [paint the town red]!'],['Anna','Sounds like a plan!']]]];
$('#lesson').innerHTML=DL.map((d,i)=>`<section class="pn" id="d${i}" data-n="lesson"><div class="in"><div class="cap rv">${d[0]} · ${d[2]}</div><h2 class="tt rv">${d[1]}</h2>
<div class="card rv"><div class="bar"><button class="btn p play" data-pd="${i}"><span class="wave"><i></i><i></i><i></i></span>Nghe hội thoại</button></div>
${d[3].map(l=>`<div class="line"><b>${l[0]}:</b><span>${l[1].replace(/\[(.+?)\]/g,'<mark data-s="$1">$1</mark>')}</span></div>`).join('')}
<div class="k">Cụm từ trong đoạn · chạm 🔊 để nghe</div><div class="pg">${PH.slice(i*6,i*6+6).map((p,j)=>`<div class="pc"><button class="sp" data-s="${p[0]}">🔊</button><div><b>${i*6+j+1}. ${p[0]}</b><span>${p[1]}</span></div></div>`).join('')}</div></div></div></section>`).join('');
/* exercises */
const Q=`We have been talking for 20 minutes. Now, let’s ___ and finish the report.|call in sick|travel light|get down to business|split the bill|C|<b>get down to business</b> = bắt tay vào việc chính (hết chuyện phiếm, làm báo cáo).
Don’t worry, the construction of the building is ___. We will finish it on time.|out of stock|on track|behind schedule|round trip|B|<b>on track</b> = đúng tiến độ ➤ khớp với “finish it on time”.
I feel terrible today. I think I have to ___ and rest at home.|call in sick|paint the town red|grab a bite|just browsing|A|<b>call in sick</b> = gọi báo nghỉ ốm vì cảm thấy không khỏe.
I need to leave early for a dentist appointment. Can you ___ me?|sleep in|catch a movie|try it on|cover for|D|<b>cover for someone</b> = làm thay việc khi người đó vắng mặt.
The project is taking too long. We are one month ___.|early bird|a steal|behind schedule|on the house|C|<b>behind schedule</b> = trễ tiến độ (dự án kéo dài quá lâu).
Good luck with your meeting with the client. Please ___ on the results.|keep me posted|show me the way|travel light|chill out|A|<b>keep me posted</b> = nhớ cập nhật tình hình cho tôi.
Good evening. I’d like ___, please. My wife is waiting outside.|a doggy bag|a table for two|a get-together|an early bird|B|<b>a table for two</b> = xin một bàn hai người (tôi và vợ).
I’m really hungry but I have a meeting in 10 minutes. Let’s just ___.|paint the town red|lost my way|split the bill|grab a bite|D|<b>grab a bite</b> = ăn vội, ăn nhẹ vì chỉ còn 10 phút.
The manager gave us free drinks. He said they were ___.|out of stock|on the house|round trip|on sale|B|<b>on the house</b> = miễn phí (nhà hàng tặng).
We ordered too much food. Could we have a ___ for this pizza?|doggy bag|rip-off|steal|table for two|A|<b>doggy bag</b> = hộp gói thức ăn thừa mang về.
Waiter, we are ready to leave. ___, please.|Keep me posted|Show me the way|Check|Try it on|C|<b>Check, please</b> = cho xin hóa đơn / tính tiền.
You don’t have to pay for all of this! Let’s ___.|catch a movie|book in advance|split the bill|call in sick|C|<b>split the bill</b> = chia hóa đơn, mỗi người trả một phần.
“Can I help you?” – “No, I’m ___, thank you.”|just browsing|travelling light|covering for you|sleeping in|A|<b>just browsing</b> = chỉ xem chứ chưa mua (trả lời nhân viên bán hàng).
This television is 30% cheaper because it’s ___ this week.|off the beaten path|a rip-off|on track|on sale|D|<b>on sale</b> = đang giảm giá (rẻ hơn 30%).
I bought this laptop for only $100! It’s ___!|a doggy bag|a steal|out of stock|round trip|B|<b>a steal</b> = món hời, giá rẻ như cho.
That dress looks beautiful. You should go to the fitting room and ___.|try it on|chill out|call in sick|split it|A|<b>try it on</b> = mặc thử (phòng thử đồ).
I wanted to buy the new iPhone, but the store told me it was ___.|on the house|behind schedule|out of stock|early bird|C|<b>out of stock</b> = đã hết hàng.
$50 for a cup of coffee? That’s a total ___!|rip-off|get-together|steal|round trip|A|<b>rip-off</b> = giá cắt cổ (50$ cho một ly cà phê).
